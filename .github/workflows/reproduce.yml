name: Reproduce research artifacts
on:
  push:
    branches: [main]
    paths:
      - experiment.py
      - build_manuscript.py
      - requirements.txt
      - .github/workflows/reproduce.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt python-docx
      - name: Generate figures, tables and Word draft
        run: |
          python experiment.py
          python build_manuscript.py
      - name: Upload reproducibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: K-DART-research-artifacts
          path: |
            outputs/
            KDART_Short_Communication_RESEARCH_DRAFT.docx
      - name: Commit research artifacts into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/ KDART_Short_Communication_RESEARCH_DRAFT.docx
          if ! git diff --cached --quiet; then
            git commit -m "Generate reproducible K-DART experimental artifacts [skip ci]"
            git push
          fi
